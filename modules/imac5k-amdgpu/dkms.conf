# DKMS package: the Apple 5K iMac amdgpu patch stack, rebuilt for every installed kernel.
# Installed by scripts/ubuntu-imac5k, which substitutes @VERSION@ and copies this directory and patches/
# to /usr/src/imac5k-amdgpu-<version>/. Not meant to be installed by hand.
PACKAGE_NAME="imac5k-amdgpu"
PACKAGE_VERSION="@VERSION@"

# Replaces the in-tree amdgpu: depmod prefers updates/ over kernel/ (Ubuntu: "search updates ubuntu built-in").
BUILT_MODULE_NAME[0]="amdgpu"
BUILT_MODULE_LOCATION[0]="drivers/gpu/drm/amd/amdgpu/"
DEST_MODULE_LOCATION[0]="/updates/dkms/"

PRE_BUILD="./imac5k-dkms prepare ${kernelver}"
MAKE[0]="./imac5k-dkms build ${kernelver} ${kernel_source_dir}"
POST_BUILD="./imac5k-dkms verify ${kernelver} ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/${kernelver}/${arch}/module"
POST_INSTALL="./imac5k-dkms post-install ${kernelver}"
CLEAN="rm -rf drivers include .imac5k-*"
AUTOINSTALL="yes"
